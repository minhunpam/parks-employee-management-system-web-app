name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      GOOGLE_OAUTH_CLIENT_ID: ci-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost/accounts/google/callback/
      GOOGLE_DRIVE_REDIRECT_URI: http://localhost/workspace/connect/callback/
      FERNET_KEY: AAA1AACAAAAFAABAHAYAAFAAAAHADSAFDADBDFHHGSGQRHNAF=

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check src/backend --config src/linter/ruff-lint.toml

      - name: Run Django tests
        working-directory: src/backend
        run: python manage.py test

      - name: Run Django deployment checks
        working-directory: src/backend
        env:
          DJANGO_DEBUG: "False"
        run: python manage.py check --deploy

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: src/frontend
        run: npm test -- --runInBand

      - name: Build production CSS
        working-directory: src/frontend
        run: npm run build:css

      - name: Verify generated CSS is committed
        run: git diff --exit-code -- src/frontend/static/css/output.css
