services:
  web:
    env_file:
      - /etc/parks/production.env
    restart: unless-stopped

  db:
    restart: unless-stopped

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro 
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
