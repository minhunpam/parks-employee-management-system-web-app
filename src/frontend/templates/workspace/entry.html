<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry</title>
    
    {% load static %}
    <script type="module" src="{% static 'workspace/entry.js' %}"></script>
</head>
<body>
    <header>
        <a href="{% url 'employees:employee-dashboard' %}">View Employee Dashboard</a>
    </header>
    <main>
        {% if configuration %}
            <section aria-labelledby="saved-resources">
                <h2 id="saved-resources">Saved resources</h2>
                <dl>
                    <dt>Drive root folder</dt>
                    <dd>{{ configuration.root_folder_id|default:"Not configured" }}</dd>
                    <dt>Main spreadsheet</dt>
                    <dd>{{ configuration.spreadsheet_id|default:"Not configured" }}</dd>
                </dl>
            </section>
        {% endif %}

        <div
            id="entry-page"
            data-csv-import-url-check="{% url 'workspace:csv-import-check' %}"
            data-csv-import-url-import="{% url 'workspace:csv-import' %}"
            data-connect-url="{% url 'workspace:connect' %}"
        ></div>

        {% csrf_token %}
        <button id="import-csv-button-check">Import CSV (CHECK)</button>
        <p id="import-csv-status-check" role="status" aria-live="polite"></p>
        <a id="reconnect-google" hidden>Reconnect Google</a>

        <button id="import-csv-button-import" hidden>Import CSV (IMPORT)</button>
    </main>
</body>
</html>
