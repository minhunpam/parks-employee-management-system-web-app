<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>

    {% load static %}
    <script type="module" src="{% static 'employees/employee-registration.js' %}"></script>
</head>
<body>
    <header>
        <button id="register-employee-button" type="button">
            Register Employee
        </button>
    </header>
    <main>
        <div
            id="employee-dashboard-page"
            data-employee-registration-url="{% url 'employees:register-employee' %}"
        ></div>
  
        <dialog id="employee-registration-modal">
            <form id="employee-registration-form">
                {% csrf_token %}
                <h2>Register Employee</h2>
                <p>
                    <label for="first-name">First name</label>
                    <input id="first-name" name="first_name" type="text" required>
                </p>
                <p>
                    <label for="last-name">Last name</label>
                    <input id="last-name" name="last_name" type="text" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </p>
                <p>
                    <label for="working-status">
                    <select id="working-status", name="working_status">
                        <option value="active">Active</option>
                        <option value="archived">Archived </option>
                    </select>
                </p>
                <p>
                    <label for="employment-start-date">Employment start date</label>
                    <input id="employment-start-date" name="employment_start_date" type="date" required>
                </p>
                <p>
                    <label for="employment-end-date">Employment end date</label>
                    <input id="employment-end-date" name="employment_end_date" type="date">
                </p>
                <p>
                    <label for="work-days-per-week">Work days per week</label>
                    <input id="work-days-per-week" name="work_days_per_week" type="number" min="1" max="7" value="5" required>
                </p>
                <p>
                    <label for="monthly-target-hours">Monthly target hours</label>
                    <input id="monthly-target-hours" name="monthly_target_hours" type="number" min="0" step="0.01" value="173.00" required>
                </p>
                <div>
                    <button id="cancel-registration-button" type="button">Cancel</button>
                    <button type="submit">Register</button>
                </div>
                <p id="employee-registration-status" role="status" aria-live="polite"></p>
            </form>
        </dialog>
    </main>
</body>
</html>
