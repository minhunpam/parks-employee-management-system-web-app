<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PARKS employee management dashboard.">
    <title>Employee dashboard · PARKS</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script type="module" src="{% static 'scripts/employees/employee-dashboard.js' %}"></script>
</head>
<body class="flex flex-col min-h-screen bg-white font-sans text-[#1a1a1a] antialiased">
    <header class="bg-black text-white">
        <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6 lg:px-8" aria-label="Main navigation">
            <a href="{% url 'home' %}" class="text-xl font-bold tracking-[0.18em] text-[#76b900] focus:outline-none focus:ring-2 focus:ring-[#76b900] focus:ring-offset-2 focus:ring-offset-black">PARKS</a>
            <div class="flex items-center gap-6">
                <span class="hidden text-sm text-white/70 sm:inline">Employee management</span>
                <a href="{% url 'workspace:entry' %}" class="text-sm font-bold text-white hover:text-[#76b900]">
                    Workspace
                    <!--<span aria-hidden="true">→</span>-->
                </a>
            </div>
        </nav>
    </header>
    
    <div class="border-b border-[#cccccc] bg-[#f7f7f7]">
        <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-3 text-xs font-bold uppercase tracking-wide text-[#757575] lg:px-8">
            <span class="text-[#76b900]">Employee management</span>
            <span aria-hidden="true">/</span>
            <span>Dashboard</span>
        </div>
    </div>

    <main 
        id="employee-dashboard" class="flex-1"
        data-api-url="{% url 'employees:employee-dashboard-data' %}"
        data-employee-details-url = "{% url 'employees:employee-details' employee_id=0 %}">
        <section class="bg-black text-white" aria-labelledby="dashboard-heading">
            <div class="mx-auto flex max-w-7xl flex-col gap-8 px-6 py-14 lg:flex-row lg:items-end lg:justify-between lg:px-8 lg:py-16">
                <div>
                    <p class="text-sm font-bold uppercase tracking-wide text-[#76b900]">Employee records</p>
                    <h1 id="dashboard-heading" class="mt-3 text-4xl font-bold leading-tight sm:text-5xl">Employee management.</h1>
                    <p class="mt-5 max-w-2xl text-lg leading-7 text-white/70">Review employee records, monthly working balances, and yearly vacation summaries.</p>
                </div>
                
                <a id="register-link" href="{% url 'employees:employee-register' %}" class="inline-flex min-h-11 items-center justify-center bg-[#76b900] px-6 py-3 text-base font-bold text-black hover:bg-[#5a8d00] focus:outline-none focus:ring-2 focus:ring-[#76b900] focus:ring-offset-2 focus:ring-offset-black">
                    Register employee
                    <!--<span class="ml-3" aria-hidden="true">→</span>-->
                </a>
            </div>
        </section>

        <section class="mx-auto max-w-7xl px-6 py-10 lg:px-8 lg:py-14">
            <div class="border-b border-[#cccccc]" role="tablist" aria-label="Employee data views">
                <button class="dashboard-tab px-4 py-3 text-sm font-bold hover:text-black" data-tab="employees" role="tab" aria-selected="true">Employees</button>
                <button class="dashboard-tab px-4 py-3 text-sm font-bold text-[#757575] hover:text-black" data-tab="monthly" role="tab" aria-selected="false">Monthly summaries</button>
                <button class="dashboard-tab px-4 py-3 text-sm font-bold text-[#757575] hover:text-black" data-tab="yearly" role="tab" aria-selected="false">Yearly summaries</button>
            </div>

            <div id="summary-cards" class="mt-8 grid gap-4 sm:grid-cols-3"></div>
            <form id="filters" class="mt-8 grid gap-4 border border-[#cccccc] bg-[#f7f7f7] p-5 sm:grid-cols-2 lg:grid-cols-4" role="search">
                
                <label class="text-sm font-bold">
                    Search
                    <input id="search" type="search" placeholder="Name or email" class="mt-2 block h-11 w-full border border-[#cccccc] bg-white px-4 font-normal focus:border-2 focus:border-[#76b900] focus:outline-none">
                </label>
                
                <label id="status-filter" class="text-sm font-bold">
                    Status
                    <select id="status-drop-down" class="mt-2 block h-11 w-full border border-[#cccccc] bg-white px-4 font-normal focus:border-2 focus:border-[#76b900] focus:outline-none">
                        <option value="">All statuses</option>
                        <option value="active">Active</option>
                        <option value="archived">Archived</option>
                    </select>
                </label>
                
                <label id="year-filter" class="text-sm font-bold">
                    Year
                    <select id="year-drop-down" class="mt-2 block h-11 w-full border border-[#cccccc] bg-white px-4 font-normal focus:border-2 focus:border-[#76b900] focus:outline-none">
                        <option value="">All years</option>
                    </select>
                </label>
                
                <label id="month-filter" class="text-sm font-bold">
                    Month
                    <select id="month-drop-down" class="mt-2 block h-11 w-full border border-[#cccccc] bg-white px-4 font-normal focus:border-2 focus:border-[#76b900] focus:outline-none">
                        <option value="">All months</option>
                    </select>
                </label>
                
                <button id="reset-filters" type="reset" class="min-h-11 self-end border-2 border-[#76b900] px-5 py-3 text-sm font-bold hover:bg-[#76b900] focus:outline-none focus:ring-2 focus:ring-[#76b900]">Reset filters</button>
            </form>

            <p id="table-status" class="mt-6 min-h-6 text-sm font-bold" role="status" aria-live="polite"></p>
            <div class="mt-2 overflow-x-auto border border-[#cccccc]">
                <table class="w-full min-w-[760px] border-collapse text-left text-sm">
                    <thead id="table-head" class="bg-[#f7f7f7] text-xs uppercase tracking-wide text-[#757575]"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            
            <div id="empty-state" class="hidden border border-t-0 border-[#cccccc] p-10 text-center">
                <h2 id="empty-title" class="text-xl font-bold"></h2>
                <p id="empty-message" class="mt-2 text-sm text-[#757575]"></p>
            </div>
            
            <div class="mt-6 flex items-center justify-between">
                <span id="page-summary" class="text-sm text-[#757575]"></span>
                <div class="flex gap-2">
                    <button id="previous-page" class="min-h-11 border border-[#cccccc] px-4 text-sm font-bold disabled:cursor-not-allowed disabled:text-[#a7a7a7]" disabled>Previous</button>
                    <button id="next-page" class="min-h-11 border border-[#cccccc] px-4 text-sm font-bold disabled:cursor-not-allowed disabled:text-[#a7a7a7]" disabled>Next</button>
                </div>
            </div>
            
        </section>
    </main>
    
    <footer class="bg-black text-white/70">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-8 text-sm lg:px-8">
            <span class="font-bold tracking-[0.18em] text-[#76b900]">PARKS</span>
            <span>Employee management system</span>
        </div>
    </footer>
</body>
</html>
