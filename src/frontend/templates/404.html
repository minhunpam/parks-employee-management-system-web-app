<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The requested PARKS page could not be found.">
    <title>Page not found · PARKS</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script type="module" src="{% static 'scripts/not-found.js' %}"></script>
</head>
<body class="flex min-h-screen flex-col bg-black font-sans text-white antialiased">
    <header class="sticky top-0 z-50 mx-auto flex w-full max-w-7xl items-center justify-between px-6 py-6 sm:px-8 lg:px-12" aria-label="PARKS identity">
        <a href="{% url 'home' %}" class="text-xl font-bold tracking-[0.18em] text-[#76b900] focus:outline-none focus:ring-2 focus:ring-[#76b900] focus:ring-offset-2 focus:ring-offset-black">PARKS</a>
        <span class="h-3 w-3 bg-[#76b900]" aria-hidden="true"></span>
    </header>

    <main class="flex flex-1 items-center">
        <section class="mx-auto w-full max-w-7xl px-6 py-16 sm:px-8 lg:px-12 lg:py-24" aria-labelledby="not-found-heading">
            <div class="max-w-3xl">
                <p class="text-[clamp(5rem,18vw,14rem)] font-bold leading-[0.85] tracking-[-0.06em] text-[#76b900]" aria-label="Error 404">404</p>
                <div class="mt-10 border-l-2 border-[#76b900] pl-5 sm:pl-8">
                    <!--<p class="text-sm font-bold uppercase tracking-[0.14em] text-[#76b900]">404</p>-->
                    <h1 id="not-found-heading" class="mt-3 text-4xl font-bold leading-tight sm:text-5xl">Page not found</h1>
                    <p class="mt-5 max-w-xl text-base leading-7 text-white/70 sm:text-lg">The page you’re looking for doesn’t exist or may have moved.</p>
                    <div class="mt-8 flex flex-col gap-4 sm:flex-row">
                        <a href="{% url 'home' %}" class="inline-flex min-h-11 items-center justify-center rounded-[2px] bg-[#76b900] px-6 py-3 text-base font-bold text-black transition hover:bg-[#5a8d00] focus:outline-none focus:ring-2 focus:ring-[#76b900] focus:ring-offset-2 focus:ring-offset-black">Return to home</a>
                        <button type="button" data-back-button data-home-url="{% url 'home' %}" class="inline-flex min-h-11 items-center justify-center rounded-[2px] border border-white px-6 py-3 text-base font-bold text-white transition hover:border-[#76b900] hover:text-[#76b900] focus:outline-none focus:ring-2 focus:ring-[#76b900] focus:ring-offset-2 focus:ring-offset-black">Go back</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="mx-auto flex w-full max-w-7xl flex-col gap-2 border-t border-[#5e5e5e] px-6 py-6 text-xs text-white/70 sm:flex-row sm:items-center sm:justify-between sm:px-8 lg:px-12">
        <span class="font-bold tracking-[0.18em] text-[#76b900]">PARKS</span>
        <span>Employee management system</span>
    </footer>
</body>
</html>
