
# Run with ruff check <(.|<target_directory>)> --config linter/ruff-lint.toml
exclude = [
    '.venv',
    '__pycache__',
    '.egg-info',
    '**/migrations/**',
    ".ruff_cache",
]
force-exclude = true
line-length = 200

[lint]
select = [ 
    # pycodestyle 
    "E",
   # Pyflakes
   "F",
   # pyupgrade
   "UP",
   # flake8-bugbear
   "B",
   # flake8-simplify
   "SIM",
   # isort
   "I",]

# See rules ignored in linting section of rull_rules.md
ignore = [
    'D100', 'D101', 'D102', 'D103', 'D107',
    'D202', 'D203', 'D204', 'D205', 'D208', 'D212', 'D214', 'D215',
    'D400', 'D401', 'D404', 'D413', 'D415', 'D417', 
    'I001',
    'SIM117'
]