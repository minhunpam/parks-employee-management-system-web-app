server {
    listen 80;
    server_name 178.105.238.247.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 178.105.238.247.nip.io;

    ssl_certificate /etc/letsencrypt/live/178.105.238.247.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178.105.238.247.nip.io/privkey.pem;
    
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    location / {
        proxy_pass http://web:8000;

        # Pass the original hostname to Django
        proxy_set_header Host $host;

        # Pass the original visitor's IP address
        proxy_set_header X-Real-IP $remote_addr;

        # Preserve the chain of IP addresses if multiple proxies are involved
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell Django whether the original request used HTTP and HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
