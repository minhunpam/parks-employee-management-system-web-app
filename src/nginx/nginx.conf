server {
    listen 80;
    server_name _;
    
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    location / {
        proxy_pass http://web:8000;

        # Pass the original hostname to Django
        proxy_set_header Host $host;

        # Pass the original visitor's IP address
        proxy_set_header X-Real-IP $remote_addr;

        # Preserve the chain of IP addresses if multiple proxies are involved
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell Django whether the original request used HTTP and HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
